<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李文元 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        /* 语言切换按钮 */
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(22, 24, 35, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 80, 0.3);
            border-radius: 24px;
            padding: 6px;
            box-shadow: 0 4px 16px rgba(255, 0, 80, 0.2);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #a8a8a8;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            color: #ffffff;
            background: rgba(255, 0, 80, 0.1);
        }

        .lang-btn.active {
            color: #FF0050;
            background: rgba(255, 0, 80, 0.2);
            font-weight: 600;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 40px;
        }

        /* 个人信息部分 - TikTok Shop风格 */
        .profile-section {
            background: #161823;
            border-radius: 16px;
            padding: 48px;
            margin-bottom: 32px;
            box-shadow: 0 4px 24px rgba(255, 0, 80, 0.15);
            border: 1px solid rgba(255, 0, 80, 0.2);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        /* 头像部分 */
        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid #FF0050;
            box-shadow: 0 4px 16px rgba(255, 0, 80, 0.3);
            background: #2a2a2a;
        }

        .contact-btn-wrapper {
            width: 100%;
        }

        .contact-btn {
            width: 100%;
            background: #FF0050;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 0, 80, 0.4);
        }

        .contact-btn:hover {
            background: #FF1A66;
            box-shadow: 0 6px 20px rgba(255, 0, 80, 0.5);
            transform: translateY(-2px);
        }

        .contact-btn:active {
            transform: translateY(0);
        }

        /* 信息部分 */
        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .profile-info-wrapper {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            padding-top: 8px;
        }

        .profile-help-section {
            flex-shrink: 0;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 32px;
            border-left: 1px solid rgba(255, 0, 80, 0.2);
        }

        .quick-entry-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .quick-entry-buttons {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .quick-entry-btn {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 0, 80, 0.1);
            color: #ffffff;
            padding: 12px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid rgba(255, 0, 80, 0.3);
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-entry-btn:hover {
            background: rgba(255, 0, 80, 0.2);
            border-color: #FF0050;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 80, 0.3);
        }

        .quick-entry-btn:active {
            transform: translateY(0);
        }

        .quick-entry-btn-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .quick-entry-note {
            font-size: 11px;
            color: #a8a8a8;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 10px;
            padding: 0 4px;
            margin-top: 0;
        }

        .quick-entry-divider {
            height: 1px;
            background: rgba(255, 0, 80, 0.2);
            margin-bottom: 10px;
            width: 100%;
        }

        .help-button-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .help-button {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 0, 80, 0.15) 0%, rgba(255, 0, 80, 0.1) 100%);
            color: #FF0050;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(255, 0, 80, 0.3);
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .help-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 80, 0.1), transparent);
            transition: left 0.5s;
        }

        .help-button:hover::before {
            left: 100%;
        }

        .help-button:hover {
            background: linear-gradient(135deg, rgba(255, 0, 80, 0.25) 0%, rgba(255, 0, 80, 0.15) 100%);
            border-color: #FF0050;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 80, 0.3);
        }

        .help-button:active {
            transform: translateY(0);
        }

        .help-label {
            font-size: 11px;
            color: #a8a8a8;
            text-align: center;
            margin-top: 4px;
            line-height: 1.4;
        }

        .profile-name-title {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .profile-title {
            font-size: 16px;
            font-weight: 500;
            color: #FF0050;
            padding: 8px 16px;
            background: rgba(255, 0, 80, 0.1);
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
            border: 1px solid rgba(255, 0, 80, 0.3);
        }

        .profile-link {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            padding: 8px 16px;
            background: rgba(255, 0, 80, 0.15);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid rgba(255, 0, 80, 0.3);
            transition: all 0.2s ease;
        }

        .profile-link:hover {
            background: rgba(255, 0, 80, 0.25);
            border-color: #FF0050;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 0, 80, 0.3);
        }

        .profile-link::after {
            content: '→';
            color: #FF0050;
            font-weight: bold;
            margin-left: 4px;
        }

        .profile-industry {
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            background: rgba(255, 0, 80, 0.08);
            border-radius: 8px;
            border-left: 3px solid #FF0050;
            margin: 8px 0;
        }

        .profile-bio {
            color: #a8a8a8;
            font-size: 15px;
            line-height: 1.7;
            max-width: 600px;
        }

        /* 二维码模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: #161823;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(255, 0, 80, 0.3);
            border: 1px solid rgba(255, 0, 80, 0.3);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #a8a8a8;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 80, 0.2);
            color: #FF0050;
        }

        .qr-codes {
            display: flex;
            gap: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-item {
            text-align: center;
        }

        .qr-item-title {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .qr-code-img {
            width: 180px;
            height: 180px;
            border: 2px solid rgba(255, 0, 80, 0.3);
            border-radius: 8px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a8a8a8;
            font-size: 14px;
        }

        .email-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 0, 80, 0.2);
            text-align: center;
        }

        .email-label {
            font-size: 14px;
            color: #a8a8a8;
            margin-bottom: 12px;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #FF0050;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 24px;
            background: rgba(255, 0, 80, 0.1);
            border: 1px solid rgba(255, 0, 80, 0.3);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .email-link:hover {
            background: rgba(255, 0, 80, 0.2);
            border-color: #FF0050;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 80, 0.3);
        }

        /* 作品集部分 - TikTok Shop风格 */
        .gallery-section {
            background: #161823;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(255, 0, 80, 0.15);
            border: 1px solid rgba(255, 0, 80, 0.2);
        }

        .section-divider {
            margin: 16px 0;
            position: relative;
            text-align: center;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: calc(50% - 80px);
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 0, 80, 0.3), rgba(255, 0, 80, 0.3), transparent);
        }

        .section-divider::before {
            left: 0;
        }

        .section-divider::after {
            right: 0;
        }

        .section-title {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            padding: 0 20px;
            display: inline-block;
            background: #161823;
            position: relative;
            z-index: 1;
        }

        .section-subtitle {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .section-note {
            font-size: 13px;
            color: #a8a8a8;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .links-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .links-row-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .links-row-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .links-row-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .links-row-6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .links-row-2x3 {
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            row-gap: 24px;
        }

        .links-row-2x3 .link-card-large {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .links-row-2x3 .link-card-large:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(255, 0, 80, 0.4);
        }

        .links-row-2x3 .link-card-image {
            height: 200px;
            flex-shrink: 0;
        }

        .links-row-2x3 .link-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px;
        }

        .links-row-2x3 .link-card-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .links-row-2x3 .link-card-desc {
            font-size: 13px;
            line-height: 1.6;
            flex: 1;
        }

        .link-card-large {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            background: #2a2a2a;
            border: 1px solid rgba(255, 0, 80, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            height: 100%;
        }

        .link-card-large:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.4);
            border-color: #FF0050;
        }

        .link-card-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .link-card-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 0, 80, 0.1) 0%, rgba(255, 0, 80, 0.05) 100%);
        }

        .link-card-icon {
            font-size: 72px;
            z-index: 1;
            position: relative;
            filter: drop-shadow(0 2px 8px rgba(255, 0, 80, 0.3));
        }

        .link-card-image::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 80, 0.15) 0%, transparent 70%);
            z-index: 0;
        }

        .link-card-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .link-card-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .link-card-desc {
            font-size: 14px;
            color: #a8a8a8;
            line-height: 1.6;
        }

        .link-card-arrow {
            margin-top: 16px;
            color: #FF0050;
            font-size: 20px;
            font-weight: bold;
        }

        /* 底部按钮 */
        .footer-section {
            margin-top: 60px;
            padding-top: 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 0, 80, 0.2);
        }

        .footer-button {
            display: inline-block;
            background: linear-gradient(135deg, #FF0050 0%, #FF1A66 100%);
            color: white;
            padding: 16px 48px;
            border-radius: 32px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid rgba(255, 0, 80, 0.3);
            box-shadow: 0 4px 16px rgba(255, 0, 80, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .footer-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .footer-button:hover::before {
            left: 100%;
        }

        .footer-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.5);
            border-color: #FF0050;
        }

        .footer-button:active {
            transform: translateY(-1px);
        }


        /* 响应式设计 */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                gap: 32px;
            }

            .avatar-wrapper {
                width: 100%;
            }

            .avatar {
                width: 140px;
                height: 140px;
            }

            .profile-name {
                font-size: 28px;
                text-align: center;
            }

            .profile-title-row {
                justify-content: center;
                flex-direction: column;
                align-items: center;
            }

            .profile-title {
                text-align: center;
                width: 100%;
            }

            .profile-link {
                width: 100%;
                justify-content: center;
            }

            .profile-bio {
                text-align: center;
            }

            .profile-info-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .profile-info-wrapper::before {
                display: none;
            }

            .profile-help-section {
                width: 100%;
                margin-top: 24px;
                padding-left: 0;
                border-left: none;
                border-top: 1px solid rgba(255, 0, 80, 0.2);
                padding-top: 24px;
            }

            .quick-entry-buttons {
                margin-bottom: 16px;
                flex-direction: column;
            }

            .quick-entry-btn {
                width: 100%;
            }

            .links-row-3,
            .links-row-4,
            .links-row-5,
            .links-row-6 {
                grid-template-columns: repeat(2, 1fr);
            }

            .link-card-image {
                height: 160px;
            }

            .section-subtitle {
                font-size: 18px;
            }
        }

        @media (max-width: 1024px) {
            .links-row-3 {
                grid-template-columns: repeat(3, 1fr);
            }

            .links-row-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            .links-row-5 {
                grid-template-columns: repeat(3, 1fr);
            }

            .links-row-6 {
                grid-template-columns: repeat(3, 1fr);
            }

            .links-row-2x3 {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .links-row-3,
            .links-row-4,
            .links-row-5,
            .links-row-6,
            .links-row-2x3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .links-row-3,
            .links-row-4,
            .links-row-5,
            .links-row-6,
            .links-row-2x3 {
                grid-template-columns: 1fr;
            }

            .profile-section,
            .gallery-section {
                padding: 24px;
            }

            .qr-codes {
                flex-direction: column;
                align-items: center;
            }

            .footer-button {
                padding: 14px 36px;
                font-size: 16px;
            }

            .language-switcher {
                top: 10px;
                right: 10px;
                padding: 4px;
            }

            .lang-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 个人信息部分 -->
        <section class="profile-section">
            <div class="profile-header">
                <!-- 左侧：头像和联系按钮 -->
                <div class="avatar-wrapper">
                    <img src="avatar.png.jpg" alt="李文元头像" class="avatar" id="avatar">
                    <div class="contact-btn-wrapper">
                        <button class="contact-btn" onclick="openContactModal()" data-i18n="contact-me">联系我</button>
                    </div>
                </div>
                
                <!-- 右侧：信息和帮助按钮 -->
                <div class="profile-info-wrapper">
                    <div class="profile-info">
                        <!-- 名字和Title -->
                        <div class="profile-name-title">
                            <h1 class="profile-name" data-i18n="name">李文元</h1>
                            <div class="profile-title-row">
                                <div class="profile-title" data-i18n="title">TikTok Shop 墨西哥站耐消行业招运经理</div>
                                <a href="https://bytedance.sg.larkoffice.com/docx/SqK1dks81om8Etx0B6ClkxQTgSh" target="_blank" class="profile-link" data-i18n="am-card">必看AM合作名片</a>
                            </div>
                        </div>
                        
                        <!-- 行业信息 -->
                        <div class="profile-industry" data-i18n="industry">

        // 切换语言
        function switchLanguage(lang) {
            currentLang = lang;
            
            // 更新按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                }
            });

            // 更新所有带data-i18n属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                } else if (translations['zh'] && translations['zh'][key]) {
                    // 如果当前语言没有翻译，使用中文作为后备
                    element.textContent = translations['zh'][key];
                }
            });

            // 更新动态内容
            updateDynamicContent(lang);
        }

        // 更新动态内容
        function updateDynamicContent(lang) {
            const t = translations[lang] || translations['zh'];
            const tZh = translations['zh'];
            
            // 更新个人信息
            const nameEl = document.querySelector('.profile-name');
            if (nameEl) nameEl.textContent = t.name || tZh.name || '';
            
            const titleEl = document.querySelector('.profile-title');
            if (titleEl) titleEl.textContent = t.title || tZh.title || '';
            
            const industryEl = document.querySelector('.profile-industry');
            if (industryEl) industryEl.textContent = t.industry || tZh.industry || '';
            
            const bioEl = document.querySelector('.profile-bio');
            if (bioEl) bioEl.textContent = t.bio || tZh.bio || '';
            
            // 更新帮助按钮
            const helpBtn = document.querySelector('.help-button');
            if (helpBtn) helpBtn.textContent = t['help-button'] || tZh['help-button'] || '';
            
            const helpLabel = document.querySelector('.help-label');
            if (helpLabel) helpLabel.textContent = t['help-label'] || tZh['help-label'] || '';
            
            const quickEntryNote = document.querySelector('.quick-entry-note');
            if (quickEntryNote) quickEntryNote.textContent = t['quick-entry-note'] || tZh['quick-entry-note'] || '';
            
            // 重新渲染链接（使用新的渲染函数，它们会根据currentLang自动获取翻译）
            renderQuickEntryButtons();
            renderOfficialLinks();
        }
