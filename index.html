<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李文元 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 个人信息部分 - TikTok Shop风格 */
        .profile-section {
            background: #161823;
            border-radius: 16px;
            padding: 48px;
            margin-bottom: 32px;
            box-shadow: 0 4px 24px rgba(255, 0, 80, 0.15);
            border: 1px solid rgba(255, 0, 80, 0.2);
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 48px;
        }

        /* 头像部分 */
        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid #FF0050;
            box-shadow: 0 4px 16px rgba(255, 0, 80, 0.3);
            background: #2a2a2a;
        }

        .contact-btn-wrapper {
            width: 100%;
        }

        .contact-btn {
            width: 100%;
            background: #FF0050;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 0, 80, 0.4);
        }

        .contact-btn:hover {
            background: #FF1A66;
            box-shadow: 0 6px 20px rgba(255, 0, 80, 0.5);
            transform: translateY(-2px);
        }

        .contact-btn:active {
            transform: translateY(0);
        }

        /* 信息部分 */
        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .profile-name-title {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .profile-title {
            font-size: 16px;
            font-weight: 500;
            color: #FF0050;
            padding: 8px 16px;
            background: rgba(255, 0, 80, 0.1);
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
            border: 1px solid rgba(255, 0, 80, 0.3);
        }

        .profile-link {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            padding: 8px 16px;
            background: rgba(255, 0, 80, 0.15);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid rgba(255, 0, 80, 0.3);
            transition: all 0.2s ease;
        }

        .profile-link:hover {
            background: rgba(255, 0, 80, 0.25);
            border-color: #FF0050;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 0, 80, 0.3);
        }

        .profile-link::after {
            content: '→';
            color: #FF0050;
            font-weight: bold;
            margin-left: 4px;
        }

        .profile-bio {
            color: #a8a8a8;
            font-size: 15px;
            line-height: 1.7;
            max-width: 600px;
        }

        /* 二维码模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: #161823;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(255, 0, 80, 0.3);
            border: 1px solid rgba(255, 0, 80, 0.3);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #a8a8a8;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 80, 0.2);
            color: #FF0050;
        }

        .qr-codes {
            display: flex;
            gap: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-item {
            text-align: center;
        }

        .qr-item-title {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .qr-code-img {
            width: 180px;
            height: 180px;
            border: 2px solid rgba(255, 0, 80, 0.3);
            border-radius: 8px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a8a8a8;
            font-size: 14px;
        }

        /* 作品集部分 - TikTok Shop风格 */
        .gallery-section {
            background: #161823;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(255, 0, 80, 0.15);
            border: 1px solid rgba(255, 0, 80, 0.2);
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .section-note {
            font-size: 13px;
            color: #a8a8a8;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .links-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .link-card-large {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            background: #2a2a2a;
            border: 1px solid rgba(255, 0, 80, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            height: 100%;
        }

        .link-card-large:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.4);
            border-color: #FF0050;
        }

        .link-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .link-card-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 0, 80, 0.1) 0%, rgba(255, 0, 80, 0.05) 100%);
        }

        .link-card-icon {
            font-size: 72px;
            z-index: 1;
            position: relative;
            filter: drop-shadow(0 2px 8px rgba(255, 0, 80, 0.3));
        }

        .link-card-image::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 80, 0.15) 0%, transparent 70%);
            z-index: 0;
        }

        .link-card-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .link-card-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .link-card-desc {
            font-size: 14px;
            color: #a8a8a8;
            line-height: 1.6;
        }

        .link-card-arrow {
            margin-top: 16px;
            color: #FF0050;
            font-size: 20px;
            font-weight: bold;
        }


        /* 响应式设计 */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                gap: 32px;
            }

            .avatar-wrapper {
                width: 100%;
            }

            .avatar {
                width: 140px;
                height: 140px;
            }

            .profile-name {
                font-size: 28px;
                text-align: center;
            }

            .profile-title-row {
                justify-content: center;
                flex-direction: column;
                align-items: center;
            }

            .profile-title {
                text-align: center;
                width: 100%;
            }

            .profile-link {
                width: 100%;
                justify-content: center;
            }

            .profile-bio {
                text-align: center;
            }

            .links-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .link-card-image {
                height: 160px;
            }
        }

        @media (max-width: 1024px) {
            .links-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .links-row {
                grid-template-columns: 1fr;
            }

            .profile-section,
            .gallery-section {
                padding: 24px;
            }

            .qr-codes {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 个人信息部分 -->
        <section class="profile-section">
            <div class="profile-header">
                <!-- 左侧：头像和联系按钮 -->
                <div class="avatar-wrapper">
                    <img src="avatar.png.jpg" alt="李文元头像" class="avatar" id="avatar">
                    <div class="contact-btn-wrapper">
                        <button class="contact-btn" onclick="openContactModal()">联系我</button>
                    </div>
                </div>
                
                <!-- 右侧：信息 -->
                <div class="profile-info">
                    <!-- 名字和Title -->
                    <div class="profile-name-title">
                        <h1 class="profile-name">李文元</h1>
                        <div class="profile-title-row">
                            <div class="profile-title">TikTok Shop 墨西哥站耐消行业招运经理</div>
                            <a href="https://bytedance.sg.larkoffice.com/docx/SqK1dks81om8Etx0B6ClkxQTgSh" target="_blank" class="profile-link">必看AM合作名片</a>
                        </div>
                    </div>
                    
                    <!-- 简介 -->
                    <p class="profile-bio">
                        专注于TikTok Shop墨西哥市场耐消品行业的招商运营工作，致力于帮助优质品牌和商家拓展拉美市场。拥有丰富的跨境电商运营经验和深厚的行业洞察，擅长品牌孵化、市场策略制定和运营优化。致力于构建高效、可持续的电商生态，为商家创造更大价值。
                    </p>
                </div>
            </div>
        </section>

        <!-- 作品集部分 -->
        <section class="gallery-section">
            <h2 class="section-title">快速入口</h2>
            <p class="section-note">申请本本店需要完整填写所有字段，处理时间2-3工作日，会通过表单和邮件进行反馈；跨境店铺处理时效约7个工作日，会通过邮件通知您正式注册链接。</p>
            <div class="links-row" id="all-links"></div>
        </section>
    </div>

    <!-- 联系我模态框 -->
    <div class="modal" id="contactModal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">联系我</h2>
                <button class="close-btn" onclick="closeContactModal()">×</button>
            </div>
            <div class="qr-codes">
                <div class="qr-item">
                    <div class="qr-item-title">微信二维码</div>
                    <div class="qr-code-img">
                        <img src="wechat-qr.png.png" alt="微信二维码" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;">
                    </div>
                </div>
                <div class="qr-item">
                    <div class="qr-item-title">飞书二维码</div>
                    <div class="qr-code-img">
                        <img src="feishu-qr.png.png" alt="飞书二维码" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 定邀开店直达数据
        const shopLinks = [
            {
                title: '申请本本店铺',
                desc: '申请本本店需要完整填写所有字段，处理时间2-3工作日',
                url: 'https://bytedance.sg.larkoffice.com/base/P2VfbuROdaPriFs4atVlQgc2gwh?table=tbl2upLHWa6kHPWL&view=vewn4UJEXJ',
                icon: '🏪'
            },
            {
                title: '申请跨境店铺',
                desc: '跨境店铺处理时效约7个工作日，会通过邮件通知您正式注册链接',
                url: 'https://bytedance.sg.larkoffice.com/share/base/form/shrlgprHVs0wGjMPVwMYCQpFblc?from=',
                icon: '🌍'
            }
        ];

        // 官方直达链接数据
        const officialLinks = [
            {
                title: '官方运营手册',
                desc: '查看完整的运营指南和操作手册',
                url: 'https://bytedance.sg.larkoffice.com/docx/Kbfkd8JDfoSvFExgvBpl4Kuegwd',
                icon: '📖'
            },
            {
                title: '官方信息发布群',
                desc: '加入官方信息发布群，获取最新资讯',
                url: 'https://applink.larkoffice.com/client/chat/chatter/add_by_link?link_token=42clf541-5921-41dc-b24b-ca84a2tc29v6',
                icon: '💬'
            }
        ];

        // 合并所有链接
        const allLinks = [...shopLinks, ...officialLinks];

        // 渲染所有链接
        function renderAllLinks() {
            const container = document.getElementById('all-links');
            container.innerHTML = allLinks.map(item => `
                <a href="${item.url}" target="_blank" class="link-card-large">
                    <div class="link-card-image">
                        <div class="link-card-icon">${item.icon}</div>
                    </div>
                    <div class="link-card-content">
                        <div class="link-card-title">${item.title}</div>
                        <div class="link-card-desc">${item.desc}</div>
                        <div class="link-card-arrow">→</div>
                    </div>
                </a>
            `).join('');
        }

        // 打开联系模态框
        function openContactModal() {
            document.getElementById('contactModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭联系模态框
        function closeContactModal() {
            document.getElementById('contactModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 点击背景关闭
        function closeModalOnBackdrop(event) {
            if (event.target.id === 'contactModal') {
                closeContactModal();
            }
        }

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeContactModal();
            }
        });

        // 页面加载时渲染
        window.addEventListener('DOMContentLoaded', function() {
            renderAllLinks();
        });
    </script>
</body>
</html>
